services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: statssa
      POSTGRES_PASSWORD: statssa
      POSTGRES_DB: statssa
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    # Build context is the repo root, not backend/ — the container also needs
    # demo/seed-data-for-demo/ (specs/011) for the pre-seeded demo document,
    # which lives outside backend/. See backend/Dockerfile's COPY lines.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://statssa:statssa@db:5432/statssa
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
