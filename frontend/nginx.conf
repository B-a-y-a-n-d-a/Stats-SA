# Only used by the production Docker image (Dockerfile's final stage) — local
# `npm run dev` uses vite.config.ts's dev-server proxy instead.
#
# The dev-server proxy (vite.config.ts: "/api" -> "http://localhost:8000") only
# exists while `vite` itself is running; the Docker build instead runs
# `vite build` and serves the static output, which has no proxy of its own.
# Without this, every `/api/...` call from client.ts (specs/004) would 404
# against the frontend container's own static server — found exactly this way,
# walking the docker-compose demo script live for specs/011.
server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # backend is the docker-compose service name (infra/docker-compose.yml) —
    # Docker's internal DNS resolves it to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: react-router-dom's BrowserRouter (main.tsx) handles routes
    # like /curator client-side, so a direct load/refresh on any of them must
    # still resolve to index.html rather than a raw nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
